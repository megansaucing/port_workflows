name: Create GitHub Repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the repository to create'
        required: true
        type: string
      description:
        description: 'Repository description'
        required: false
        type: string
        default: ''
      visibility:
        description: 'Repository visibility'
        required: false
        type: choice
        options:
          - public
          - private
        default: 'public'
      port_node_run_id:
        description: 'Port node run ID (wfnr_...)'
        required: true
        type: string

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Get Port access token
        id: port_token
        run: |
          TOKEN=$(curl -s -X POST "https://api.port.io/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d '{"clientId": "${{ secrets.PORT_CLIENT_ID }}", "clientSecret": "${{ secrets.PORT_CLIENT_SECRET }}"}' \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_PAT }}
        run: |
          gh repo create "${{ inputs.repo_name }}" \
            --${{ inputs.visibility }} \
            --description "${{ inputs.description }}" \
            --add-readme

      - name: Protect main branch
        if: ${{ inputs.visibility == 'public' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_PAT }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository_owner }}/${{ inputs.repo_name }}/branches/main/protection" \
            -f "required_status_checks=null" \
            -F "enforce_admins=true" \
            -f "required_pull_request_reviews[required_approving_review_count]=1" \
            -f "restrictions=null" \
            -F "allow_force_pushes=false" \
            -F "allow_deletions=false"

      - name: Report success to Port
        if: success()
        run: |
          curl -s -X PATCH "https://api.port.io/v1/workflows/nodes/runs/${{ inputs.port_node_run_id }}" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "COMPLETED", "result": "SUCCESS", "output": {"repo_name": "${{ inputs.repo_name }}"}}'

      - name: Report failure to Port
        if: failure()
        run: |
          curl -s -X PATCH "https://api.port.io/v1/workflows/nodes/runs/${{ inputs.port_node_run_id }}" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "COMPLETED", "result": "FAILED"}'
