name: Create GitHub Repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the repository to create'
        required: true
        type: string
      description:
        description: 'Repository description'
        required: false
        type: string
        default: ''

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_PAT }}
        run: |
          gh repo create "${{ inputs.repo_name }}" \
            --private \
            --description "${{ inputs.description }}"

