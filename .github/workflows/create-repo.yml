name: Create GitHub Repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the repository to create'
        required: true
        type: string
      description:
        description: 'Repository description'
        required: false
        type: string
        default: ''
      port_run_id:
        description: 'Port action run ID (for reporting status back)'
        required: false
        type: string

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Report run started
        if: ${{ inputs.port_run_id != '' }}
        run: |
          curl -X POST "https://api.getport.io/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"message": "Starting repository creation..."}' || true

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_PAT }}
        run: |
          gh repo create "megansaucing/${{ inputs.repo_name }}" \
            --public \
            --description "${{ inputs.description }}" \
            --confirm

      - name: Report success
        if: ${{ success() && inputs.port_run_id != '' }}
        run: |
          echo "Repository ${{ inputs.repo_name }} created successfully"
